<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#222226">
  <meta name="application-name" content="Chaser">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chaser">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Chaser</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Trade+Winds&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/raster-forge" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css">
  <link rel="stylesheet" href="./geo-flyover/geo-flyover.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="chaser-title.css">
  <script>
    if (sessionStorage.getItem("chaserPageFade") === "1") {
      document.documentElement.classList.add("page-fade-pending");
    }
  </script>
</head>
<body class="is-viewer">
  <div id="page-fade" aria-hidden="true"></div>
  <div class="app-layout">
    <div id="map"></div>

    <aside class="unified-panel" id="unified-panel">
      <div class="unified-panel-scroll">
        <div id="panel-main">
          <header class="panel-header" id="panel-header">
            <p id="event-panel-line" class="event-panel-line" hidden>
              <button id="event-share-btn" type="button" class="event-share-btn" hidden title="Copy public event link.." aria-label="Copy public event link">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M13.803 5.33333C13.803 3.49238 15.3022 2 17.1515 2C19.0008 2 20.5 3.49238 20.5 5.33333C20.5 7.17428 19.0008 8.66667 17.1515 8.66667C16.2177 8.66667 15.3738 8.28596 14.7671 7.67347L10.1317 10.8295C10.1745 11.0425 10.197 11.2625 10.197 11.4872C10.197 11.9322 10.109 12.3576 9.94959 12.7464L15.0323 16.0858C15.6092 15.6161 16.3473 15.3333 17.1515 15.3333C19.0008 15.3333 20.5 16.8257 20.5 18.6667C20.5 20.5076 19.0008 22 17.1515 22C15.3022 22 13.803 20.5076 13.803 18.6667C13.803 18.1845 13.9062 17.7255 14.0917 17.3111L9.05007 13.9987C8.46196 14.5098 7.6916 14.8205 6.84848 14.8205C4.99917 14.8205 3.5 13.3281 3.5 11.4872C3.5 9.64623 4.99917 8.15385 6.84848 8.15385C7.9119 8.15385 8.85853 8.64725 9.47145 9.41518L13.9639 6.35642C13.8594 6.03359 13.803 5.6896 13.803 5.33333Z"/>
                </svg>
              </button>
              <span id="event-panel-name" class="event-panel-name"></span>
              <span class="event-admin-actions">
                <button id="race-lock-btn" type="button" class="race-lock-btn" hidden aria-pressed="false">Lock race</button>
                <button id="event-delete-btn" type="button" class="event-delete-btn" hidden>Delete event</button>
              </span>
            </p>
            <a id="home-title-link" class="chaser-brand-row" href="./home.html" title="Home">
              <h1>GPS Chaser</h1>
              <img class="chaser-app-title-img" src="./rr_white.png" alt="">
              <h2>The lightest multi-user, live tracking map ever..</h2>
            </a>
          </header>

          <section class="panel-section panel-controls">
            <h3 id="rider-panel-title">Rider</h3>
            <button id="stop-tracking" type="button" hidden>Stop tracking</button>
            <div class="rider-status">
              <div class="status-row">
                <div class="status-label">GPS</div>
                <div id="gps-status" class="status-pill">unknown · stopped</div>
              </div>
              <div class="status-row">
                <div class="status-label">Connection</div>
                <div id="connection-status" class="status-pill status-offline">offline</div>
              </div>
            </div>
          </section>

          <section class="panel-section">
            <h3>Active Riders</h3>
            <button id="clear-sessions" type="button" hidden>Clear all traces</button>
            <ul id="user-list" class="user-list"></ul>
            <pre id="sim-log" hidden>Waiting for a fix.</pre>
          </section>
        </div>
      </div>
    </aside>
    <button id="panel-launcher" type="button" aria-label="Show panel">ⓘ</button>
  </div>

    <button id="chat-open" class="chat-open" type="button" title="Event chat" aria-label="Open event chat" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm2 4v2h12V8H6zm0 4v2h8v-2H6z"/>
      </svg>
    </button>

    <button id="viewer-replay" class="viewer-ride viewer-replay" type="button" title="Replay Rides" aria-label="Play replay" aria-pressed="false" hidden>
      <svg class="replay-play" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M8 5v14l11-7z"/>
      </svg>
      <svg class="replay-pause" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
      </svg>
    </button>
    <button id="viewer-flyover" class="viewer-ride viewer-flyover" type="button" title="3D course flyover" aria-label="3D course flyover" hidden>
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <g transform="translate(14 28) scale(2.52 2.52)">
          <path fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M 88.516 72.599 H 78.88 v -6.87 h 5.786 c 2.941 0 5.333 -2.392 5.333 -5.332 c 0 -3.935 -1.397 -7.758 -3.932 -10.768 l -7.607 -9.028 c -5.538 -6.573 -13.644 -10.343 -22.239 -10.343 h -0.223 V 29.89 c 0 -4.025 -2.911 -7.377 -6.736 -8.078 v -4.411 h 35.403 c 0.819 0 1.484 -0.664 1.484 -1.484 s -0.664 -1.484 -1.484 -1.484 H 13.245 c -0.82 0 -1.484 0.664 -1.484 1.484 s 0.664 1.484 1.484 1.484 h 33.052 v 4.411 c -3.826 0.701 -6.736 4.053 -6.736 8.078 v 0.368 H 16.009 c -0.952 0 -1.807 -0.566 -2.178 -1.443 l -1.647 -3.891 c -0.837 -1.976 -2.764 -3.253 -4.911 -3.253 h -1.94 C 2.392 21.671 0 24.063 0 27.004 V 39.44 c 0 2.94 2.392 5.332 5.333 5.332 h 7.702 c 0.173 0 0.345 0.019 0.515 0.057 l 24.284 5.413 c 3.412 0.761 5.796 3.734 5.796 7.23 c 0 4.552 3.703 8.256 8.255 8.256 h 3.286 v 6.87 H 45 c -0.82 0 -1.484 0.664 -1.484 1.484 c 0 0.819 0.664 1.484 1.484 1.484 h 43.517 c 0.819 0 1.484 -0.664 1.484 -1.484 C 90 73.263 89.336 72.599 88.516 72.599 z M 76.192 42.513 l 7.607 9.028 c 0.139 0.165 0.263 0.341 0.394 0.512 c -24.324 -0.156 -26.878 -6.351 -28.055 -18.828 h 0.084 C 63.94 33.225 71.219 36.611 76.192 42.513 z M 42.527 29.89 c 0 -2.896 2.356 -5.252 5.253 -5.252 s 5.252 2.356 5.252 5.252 v 0.368 H 42.527 V 29.89 z M 46.597 57.473 c 0 -4.897 -3.338 -9.06 -8.118 -10.126 l -24.281 -5.413 c -0.38 -0.085 -0.771 -0.128 -1.163 -0.128 H 5.333 c -1.304 0 -2.366 -1.061 -2.366 -2.365 V 27.004 c 0 -1.304 1.061 -2.365 2.366 -2.365 h 1.94 c 0.952 0 1.807 0.566 2.178 1.443 l 1.647 3.891 c 0.837 1.976 2.764 3.253 4.911 3.253 H 53.16 c 1.447 15.038 5.5 21.799 31.91 21.799 c 0.279 0 0.569 -0.003 0.853 -0.005 c 0.719 1.69 1.11 3.516 1.11 5.376 c 0 1.304 -1.061 2.365 -2.366 2.365 H 51.885 C 48.969 62.762 46.597 60.389 46.597 57.473 z M 58.137 65.729 h 17.776 v 6.87 H 58.137 V 65.729 z"/>
        </g>
      </svg>
    </button>
    <button id="viewer-replay-stop" class="viewer-ride viewer-replay-stop" type="button" title="Stop replay" aria-label="Stop replay" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M6 6h12v12H6z"/>
      </svg>
    </button>
    <p class="viewer-replay-label" aria-hidden="true">&gt;&gt; replay</p>
    <a id="admin-mode-badge" class="admin-mode-badge" href="./home.html?tab=admins" title="You're in admin mode 🛠" hidden aria-label="Admin mode!">&#x1F6E0;&#xFE0F;</a>
    <button id="viewer-ride" class="viewer-ride" type="button" title="Start Ride" aria-label="Start Ride">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10 2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h2v-6.2l-2.2-2.3zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/>
      </svg>
    </button>

  <div id="create-event-dialog" class="notice-dialog" hidden>
    <div class="notice-dialog-card" role="dialog" aria-modal="true" aria-labelledby="create-event-dialog-title">
      <p id="create-event-dialog-title">Create event</p>
      <div class="create-event-form">
        <input id="create-event-name" type="text" maxlength="80" placeholder="New event name" autocomplete="off">
        <label class="create-event-code-field" for="create-event-code">
          <span class="create-event-code-title">Admin code</span>
          <input id="create-event-code" type="text" maxlength="40" placeholder="·····" autocomplete="off" spellcheck="false">
        </label>
        <div class="notice-dialog-actions">
          <button id="create-event-submit" type="button">Create event</button>
          <button id="create-event-skip" type="button" class="ghost">Skip</button>
        </div>
      </div>
    </div>
  </div>

  <div id="entry-dialog" class="notice-dialog" hidden>
    <div class="notice-dialog-card">
      <p id="entry-dialog-title">Are you a Rider or a Viewer?</p>
      <div class="notice-dialog-actions">
        <button id="entry-rider" type="button">Rider</button>
        <button id="entry-viewer" type="button" class="ghost">Viewer</button>
      </div>
    </div>
  </div>

  <div id="rider-dialog" class="notice-dialog" hidden>
    <form id="rider-form" class="notice-dialog-card">
      <p id="rider-dialog-title">Put your rider name/alias here:</p>
      <input id="rider-name" type="text" maxlength="30" placeholder="Put your unique name" autocomplete="nickname">
      <p id="rider-log" hidden></p>
      <div id="rider-actions" class="notice-dialog-actions">
        <button id="rider-start" type="submit">Start Ride / Resume</button>
        <button id="rider-cancel" type="button" class="ghost">Cancel</button>
      </div>
    </form>
  </div>

  <div id="notice-dialog" class="notice-dialog" hidden>
    <div class="notice-dialog-card" role="dialog" aria-modal="true" aria-labelledby="notice-dialog-message">
      <p id="notice-dialog-message"></p>
      <input id="notice-dialog-input" type="text" autocomplete="off" spellcheck="false" hidden>
      <div class="notice-dialog-actions">
        <button id="notice-dialog-confirm" type="button">OK</button>
        <button id="notice-dialog-cancel" type="button" class="ghost" hidden>Cancel</button>
      </div>
    </div>
  </div>

  <div id="chat-dialog" class="notice-dialog chat-dialog" hidden>
    <div class="notice-dialog-card chat-dialog-card" role="dialog" aria-modal="true" aria-labelledby="chat-dialog-title">
      <div class="chat-dialog-header">
        <p id="chat-dialog-title">Event chat</p>
        <button id="chat-close" type="button" class="ghost">Close</button>
      </div>
      <ul id="chat-list" class="chat-list" aria-live="polite"></ul>
      <div id="chat-composer" class="chat-composer" hidden>
        <textarea id="chat-text" maxlength="280" rows="2" placeholder="Message (optional with photo)"></textarea>
        <div id="chat-webcam" class="chat-webcam" hidden>
          <video id="chat-webcam-video" autoplay playsinline muted></video>
          <div class="chat-webcam-actions">
            <button id="chat-webcam-snap" type="button">Snap</button>
            <button id="chat-webcam-cancel" type="button" class="ghost">Cancel</button>
          </div>
        </div>
        <div class="chat-composer-row">
          <button id="chat-camera-btn" class="chat-camera-btn" type="button" title="Take photo with camera (resized to ≤100 KB)">Take photo</button>
          <input id="chat-camera" type="file" accept="image/*" capture="environment" hidden>
          <img id="chat-preview" class="chat-preview" alt="" hidden>
          <button id="chat-send" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="./geo-flyover/geo-flyover.js"></script>
  <script src="track-grade.js"></script>
  <script src="gpx.js"></script>
  <script src="app.js"></script>
</body>
</html>
