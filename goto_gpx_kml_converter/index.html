<!DOCTYPE html>
<html lang="en">
<head>
  <title>GPX ↔ KML Converter</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#00b9fe">

  <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" crossorigin=""></script>

  <link rel="stylesheet" href="//unpkg.com/leaflet-easybutton@2.0.0/src/easy-button.css">
  <script src="//unpkg.com/leaflet-easybutton@2.0.0/src/easy-button.js"></script>

  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <script src="https://kit.fontawesome.com/4298fb9c85.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/L.Control.Locate.min.css" />
  <script src="javascript/L.Control.Locate.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
  <script src="javascript/leaflet.togpx.js"></script>
  <script src="javascript/leaflet.tokml.js"></script>

  <link rel="stylesheet" href="css/leaflet_map.css" type="text/css" />
  <link rel="stylesheet" href="css/converter.css" type="text/css" />
</head>
<body>
  <header class="converter-header">
    <h1>Your GoTo GPX ↔ KML CONVERTER</h1>
  </header>

  <aside id="converter-panel" class="converter-panel legacy-panel-frame" aria-label="Track converter">
    <div class="legacy-panel-inner converter-panel-inner">
      <h2>Tracks</h2>
      <p class="converter-hint">Upload GPX, KML, ZIP, or KMZ (tracks and waypoints). Click items to multi-select; click again to deselect. Name/description edit when exactly one is selected.</p>

      <input type="file" id="converter-file-input" accept=".gpx,.kml,.zip,.kmz,application/gpx+xml,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz,application/zip" multiple hidden>

      <button type="button" class="legacy-action-btn" id="converter-upload-btn" title="Upload GPX, KML, ZIP, or KMZ files">Upload files</button>

      <ul id="converter-track-list" class="converter-track-list" aria-label="Loaded tracks"></ul>

      <label class="converter-field-label" for="converter-name">Name</label>
      <input type="text" id="converter-name" class="converter-field" disabled autocomplete="off" title="Edit when exactly one track is selected">

      <label class="converter-field-label" for="converter-desc">Description</label>
      <textarea id="converter-desc" class="converter-field converter-desc" rows="2" disabled title="Edit when exactly one track is selected"></textarea>

      <div class="converter-btn-row">
        <button type="button" class="legacy-action-btn" id="converter-dl-gpx" disabled title="Download selected track(s) as GPX (ZIP if several)">GPX</button>
        <button type="button" class="legacy-action-btn" id="converter-dl-kml" disabled title="Download selected track(s) as KML (ZIP if several)">KML</button>
      </div>
      <div class="converter-btn-row">
        <button type="button" class="legacy-action-btn" id="converter-dl-zip-gpx" disabled title="Download all tracks as a ZIP of GPX files">All ZIP (GPX)</button>
        <button type="button" class="legacy-action-btn" id="converter-dl-zip-kml" disabled title="Download all tracks as a ZIP of KML files">All ZIP (KML)</button>
      </div>
      <div class="converter-btn-row">
        <button type="button" class="legacy-action-btn converter-btn-danger" id="converter-remove" disabled title="Remove selected track(s) and clear selection">Remove</button>
        <button type="button" class="legacy-action-btn converter-btn-danger" id="converter-clear" disabled title="Remove all loaded tracks">Clear all</button>
      </div>
    </div>
  </aside>

  <main>
    <section id="map"><div id="map-3d" class="legacy-map-3d" aria-hidden="true"></div></section>
  </main>

  <script src="javascript/terrain_map_3d.js"></script>
  <script src="javascript/converter_app.js"></script>
</body>
</html>
