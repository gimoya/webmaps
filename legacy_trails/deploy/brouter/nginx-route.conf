# nginx site — BRouter front door
#
# Install (Ubuntu):
#   sudo cp nginx-route.conf /etc/nginx/sites-available/route.tiroltrailhead.com
#   # edit: server_name, SSL paths (certbot), allow YOUR admin IPs, CORS origins
#   sudo ln -sf /etc/nginx/sites-available/route.tiroltrailhead.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS A → VPS):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d route.tiroltrailhead.com
#
# BRouter stays on 127.0.0.1:17777 only via host firewall (see runbook).

# --- CORS: list Digitize / map origins explicitly ---
map $http_origin $brouter_cors_origin {
    default "";
    "https://tiroltrailhead.com" $http_origin;
    "https://www.tiroltrailhead.com" $http_origin;
    # local / static preview hosts — add as needed:
    "http://127.0.0.1:5500" $http_origin;
    "http://localhost:5500" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:8080" $http_origin;
    "http://localhost:8080" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name route.tiroltrailhead.com;

    # certbot will replace this with HTTPS; keep ACME reachable
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name route.tiroltrailhead.com;

    # Filled by certbot — placeholders until first issue:
    # ssl_certificate     /etc/letsencrypt/live/route.tiroltrailhead.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/route.tiroltrailhead.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Lock-down: admin / office IPs only ---
    allow 127.0.0.1;
    # Admin public IP (home/office) — add more as needed:
    allow 217.149.164.218;
    # Android test IP (mobile; may change with CGNAT):
    allow 41.66.97.22;
    # allow YOUR.OTHER.IPV4;
    deny all;

    # Optional: basic auth instead of / in addition to IP allow
    # auth_basic "BRouter";
    # auth_basic_user_file /etc/nginx/brouter.htpasswd;

    location = /brouter {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $brouter_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://127.0.0.1:17777/brouter;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # BRouter sends ACAO: *; duplicate headers → browser "Failed to fetch"
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $brouter_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Vary Origin always;
    }

    location / {
        return 404;
    }
}
